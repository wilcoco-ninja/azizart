name: azizart
description: AZIZART - Site web de l'artiste Olga Indigo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
    

  # ═══════════════════════════════════════════════════════════════════════
  # LOCALISATION
  # ═══════════════════════════════════════════════════════════════════════
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # ═══════════════════════════════════════════════════════════════════════
  # STATE MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════
  provider: ^6.1.2

  # ═══════════════════════════════════════════════════════════════════════
  # BACKEND / STORAGE DISTANT
  # ═══════════════════════════════════════════════════════════════════════
  supabase_flutter: ^2.0.0
  http: ^1.2.0
  mime: ^2.0.0

  # ═══════════════════════════════════════════════════════════════════════
  # IMAGES & CACHE
  # ═══════════════════════════════════════════════════════════════════════
  cached_network_image: ^4.0.3
  cached_network_image_platform_interface: ^5.0.2
  flutter_cache_manager: ^3.4.1
  shimmer: ^4.0.0

  # ═══════════════════════════════════════════════════════════════════════
  # SÉLECTION DE FICHIERS (upload admin)
  # ═══════════════════════════════════════════════════════════════════════
  image_picker: ^1.0.5
  file_picker: ^13.1.0

  # ═══════════════════════════════════════════════════════════════════════
  # UI
  # ═══════════════════════════════════════════════════════════════════════
  url_launcher: ^6.3.0
  google_fonts: ^9.0.0
  font_awesome_flutter: ^11.0.0

  # ═══════════════════════════════════════════════════════════════════════
  # UTILITAIRES
  # ═══════════════════════════════════════════════════════════════════════
  shared_preferences: ^2.2.2
  timeago: ^3.6.0
  image: ^4.0.0
  web: ^1.0.0
  translator: ^1.0.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ═══════════════════════════════════════════════════════════════════════
  # ASSETS
  # ═══════════════════════════════════════════════════════════════════════
  assets:
    - assets/