name: azizart
description: AZIZART - Site web de l'artiste Olga Indigo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localizations
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  provider: ^6.1.2

  # Supabase (remplace firebase_core / firebase_auth / cloud_firestore /
  # firebase_storage — un seul package couvre base de données, auth,
  # temps réel et stockage de fichiers)
  supabase_flutter: ^2.0.0

  # HTTP / External links
  url_launcher: ^6.3.0

  # Icons
  font_awesome_flutter: ^11.0.0

  # Media
  image_picker: ^1.0.5
  cached_network_image: ^3.3.1

  # UI
  flutter_svg: ^2.3.0
  google_fonts: ^6.1.0

  # Storage (for preferences if needed)
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/translations/

    - assets/images/atelier/
    - assets/images/gallery/
    - assets/images/new/
    - assets/images/media/
    - assets/fonts/
    - assets/images/logo/

