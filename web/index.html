  <script>
    (function () {
      var supported = false;
      try {
        var c = document.createElement('canvas');
        supported = !!(window.WebGL2RenderingContext && c.getContext('webgl2')) &&
                    typeof Promise !== 'undefined' && !!Promise.allSettled;
      } catch (e) { supported = false; }

      // Navigateur trop ancien : Flutter n'est JAMAIS chargé (le script n'est pas injecté).
      if (!supported) {
        document.addEventListener('DOMContentLoaded', function () {
          var s = document.getElementById('splash');
          s.style.letterSpacing = 'normal';
          s.innerHTML =
            '<div style="text-align:center;padding:48px 24px">' +
            '<h1 style="font-weight:600;letter-spacing:.2em">AZIZART COLORS</h1>' +

        });
        return;
      }

      // Retire l'écran d'attente dès que Flutter a dessiné sa première image.
      function hideSplash() {
        var s = document.getElementById('splash');
        if (!s) return;
        s.classList.add('hide');
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
      }
      window.addEventListener('flutter-first-frame', hideSplash);
      setTimeout(hideSplash, 20000); // filet de sécurité

      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.head.appendChild(script);
    })();
